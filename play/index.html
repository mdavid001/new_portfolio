<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku · Michelle David</title>
  <meta name="description" content="A Sudoku web game by Michelle David, with pencil-mark notes and a green flash for every completed row, column and box.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <a class="back" href="../">← Back to Michelle's portfolio</a>
    <h1>Sudoku</h1>

    <div class="bar">
      <select id="diff" aria-label="Difficulty">
        <option value="36">Easy</option>
        <option value="46" selected>Medium</option>
        <option value="52">Hard</option>
      </select>
      <button class="new" id="new">New game</button>
      <button id="notes" aria-pressed="false">✏️ Notes</button>
    </div>

    <div id="grid"></div>
    <div id="pad"></div>
    <div id="msg"></div>
    <small>Tap a cell, then a number. Keys: 1-9, arrows, Backspace, N for notes.</small>
  </main>

  <script src="script.js"></script>
</body>
</html>
